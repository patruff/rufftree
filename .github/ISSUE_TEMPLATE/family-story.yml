name: "Share a Family Story"
description: "Share a memory, story, or piece of family history to be preserved in the archive"
title: "[Story] "
labels: ["family-story", "story:pending"]
body:
  - type: markdown
    attributes:
      value: |
        ## Share a Family Memory

        Thank you for sharing a piece of family history! Your story will be preserved in the family archive.

        **How this works:**
        1. You submit your story here
        2. It's automatically added to the family archive
        3. The story becomes searchable via AI queries
        4. This issue closes automatically when done

        ---

  - type: input
    id: title
    attributes:
      label: Story Title
      description: Give your story a memorable title
      placeholder: "The Time Grandpa Built the Treehouse"
    validations:
      required: true

  - type: input
    id: author
    attributes:
      label: Your Name (Author)
      description: Who is writing/sharing this story? This helps us attribute the story correctly.
      placeholder: "Sarah Ruff"
    validations:
      required: true

  - type: checkboxes
    id: mentions
    attributes:
      label: Who Is This Story About?
      description: Select the family members this story is primarily about. These become searchable subjects.
      options:
        - label: Patrick Ruff
        - label: Jenny Wang
        - label: Joe Ruff Sr.
        - label: Debbie Ruff
        - label: Joe Ruff Jr.
        - label: Katie Ruff
        - label: Sarah Boilon
        - label: Kevin Boilon
        - label: Phil Ruff
        - label: Ashley Ruff
        - label: Annette Ludke
        - label: Stan Miller Sr.
        - label: Beth Miller Bradley
        - label: Other (specify below)

  - type: input
    id: other_people
    attributes:
      label: Other People This Story Is About
      description: If the story is about people NOT in the list above, list their names here (comma-separated).
      placeholder: "Uncle Bob, Cousin Lisa, Grandma Rose"

  - type: dropdown
    id: decade
    attributes:
      label: When Did This Story Take Place?
      description: Select the decade when this story happened. Helps with historical context.
      options:
        - "2020s (2020-present)"
        - "2010s (2010-2019)"
        - "2000s (2000-2009)"
        - "1990s (1990-1999)"
        - "1980s (1980-1989)"
        - "1970s (1970-1979)"
        - "1960s (1960-1969)"
        - "1950s (1950-1959)"
        - "1940s (1940-1949)"
        - "1930s or earlier"
        - "Not sure / Multiple decades"
    validations:
      required: true

  - type: input
    id: specific_date
    attributes:
      label: Specific Date or Year (Optional)
      description: If you know the exact year or date, enter it here
      placeholder: "Summer 1985" or "Christmas 2010" or "1963"

  - type: textarea
    id: story
    attributes:
      label: Your Story
      description: Share your family memory, story, or piece of history. Include as many details as you can remember!
      placeholder: |
        Tell your story here...

        - What happened?
        - Who was there?
        - Where did it take place?
        - What makes this memory special?
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context (Optional)
      description: Any additional information, corrections to the family tree, or context that might be helpful
      placeholder: "This story was told to me by my grandmother. The house mentioned is no longer standing."
