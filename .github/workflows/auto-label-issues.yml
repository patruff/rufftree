name: Auto-label Issues

on:
  issues:
    types: [opened]

jobs:
  auto-label:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Auto-label story issues
        uses: actions/github-script@v7
        with:
          script: |
            const issueTitle = context.payload.issue.title;
            const issueNumber = context.payload.issue.number;

            console.log(`Processing issue #${issueNumber}: "${issueTitle}"`);

            // Check if this is a story issue
            if (issueTitle.startsWith('[Story]')) {
              console.log('Detected story issue - adding comment (labels already set by template)');

              // Labels are already added by the issue template, just add an informative comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `🤖 **Automatic Processing Started**\n\nYour story has been detected and will be processed automatically. The automation will:\n\n1. Extract your story content and metadata\n2. Add it to the family Google Docs archive\n3. Index it in the AI search system with proper attribution\n4. Close this issue when complete\n\nYou'll receive another comment when processing is finished. Thank you for sharing! 📖`
              });

            } else if (issueTitle.startsWith('Add Person:')) {
              console.log('Detected person issue - adding labels');

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ['add-person', 'person:pending']
              });

              console.log('✅ Added labels: add-person, person:pending');

              // Add a comment to inform the user
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `🤖 **Automatic Processing Started**\n\nYour person has been detected and will be integrated into the family tree automatically. The automation will:\n\n1. Extract the person data from this issue\n2. Integrate them into the family tree JSON\n3. Set up relationships with existing family members\n4. Run generation and ethnicity calculations\n5. Close this issue when complete\n\nYou'll receive another comment when processing is finished. Thank you for adding to the family tree! 👨‍👩‍👧‍👦`
              });

            } else if (issueTitle.startsWith('Update Person:')) {
              console.log('Detected person update issue - adding labels');

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ['update-person', 'person:pending']
              });

              console.log('✅ Added labels: update-person, person:pending');

              // Add a comment to inform the user
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `🤖 **Automatic Processing Started**\n\nYour person update has been detected and will be processed automatically. The automation will:\n\n1. Extract the updated person data from this issue\n2. Update the person in the family tree JSON\n3. Recalculate generation and ethnicity data if needed\n4. Update profile completion percentage\n5. Close this issue when complete\n\nYou'll receive another comment when processing is finished. Thank you for keeping the family tree up to date! 👨‍👩‍👧‍👦`
              });

            } else if (issueTitle.startsWith('[Query]')) {
              console.log('Detected query issue - adding comment (labels already set by template)');

              // Labels are already added by the issue template, just add an informative comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `🤖 **Automatic Processing Started**\n\nYour question has been detected and will be answered automatically. The automation will:\n\n1. Extract your question from this issue\n2. Search through all family documents and stories using AI\n3. Generate an answer with citations from relevant sources\n4. Post the answer as a comment on this issue\n5. Close this issue when complete\n\nYou'll receive another comment with the answer shortly. Thank you for asking! 💡`
              });

            } else {
              console.log('Not a story, person, or query issue - skipping auto-label');
            }
