name: Process Person Test

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to process (leave empty to auto-find)'
        required: false
        type: string

jobs:
  test-process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Debug - Environment Info
        run: |
          echo "════════════════════════════════════════════════════════"
          echo "🔍 ENVIRONMENT DEBUG INFO"
          echo "════════════════════════════════════════════════════════"
          echo "Working directory: $(pwd)"
          echo "User: $(whoami)"
          ls -la
          python3 --version
          echo "════════════════════════════════════════════════════════"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug - After Checkout
        run: |
          echo "════════════════════════════════════════════════════════"
          echo "🔍 AFTER CHECKOUT"
          echo "════════════════════════════════════════════════════════"
          echo "Working directory: $(pwd)"
          ls -la
          if [ -f "family_tree.json" ]; then
            echo "✅ family_tree.json EXISTS ($(wc -c < family_tree.json) bytes)"
          else
            echo "❌ family_tree.json NOT FOUND"
          fi
          if [ -f "README.md" ]; then
            echo "✅ README.md EXISTS ($(wc -c < README.md) bytes)"
          else
            echo "❌ README.md NOT FOUND"
          fi
          echo "════════════════════════════════════════════════════════"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install GitHub CLI
        run: |
          echo "📦 Installing GitHub CLI..."
          sudo apt update
          sudo apt install gh -y
          gh --version

      - name: Find issue to process
        id: find_issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
        run: |
          echo "════════════════════════════════════════════════════════"
          echo "🔍 FINDING ISSUE TO PROCESS"
          echo "════════════════════════════════════════════════════════"

          if [ -n "$ISSUE_NUMBER" ]; then
            echo "📌 Using manually specified issue #$ISSUE_NUMBER"
            gh issue view $ISSUE_NUMBER --json number,title,body,labels > /tmp/issue.json
            echo "issue_number=$ISSUE_NUMBER" >> $GITHUB_OUTPUT
          else
            echo "🔍 Searching for open issues with 'add-person' label..."
            gh issue list --label "add-person" --state open --json number,title,body,labels --limit 10 > /tmp/issues.json

            echo "📊 All open add-person issues:"
            cat /tmp/issues.json | jq -r '.[] | "  #\(.number): \(.title)"'

            ISSUE_COUNT=$(cat /tmp/issues.json | jq '. | length')
            echo "📝 Total open issues: $ISSUE_COUNT"

            if [ "$ISSUE_COUNT" -eq 0 ]; then
              echo "❌ No open add-person issues found"
              echo "issue_number=" >> $GITHUB_OUTPUT
              exit 0
            fi

            # Get first issue
            cat /tmp/issues.json | jq '.[0]' > /tmp/issue.json
            ISSUE_NUM=$(cat /tmp/issue.json | jq -r '.number')

            echo "✅ Will process issue #$ISSUE_NUM"
            echo "issue_number=$ISSUE_NUM" >> $GITHUB_OUTPUT
          fi

          echo ""
          echo "📋 Issue details:"
          cat /tmp/issue.json | jq '.'
          echo "════════════════════════════════════════════════════════"

      - name: Process the person
        if: steps.find_issue.outputs.issue_number != ''
        run: python3 .github/scripts/process_person.py

      - name: Debug - Check saved files
        if: steps.find_issue.outputs.issue_number != ''
        run: |
          echo "════════════════════════════════════════════════════════"
          echo "🔍 CHECKING SAVED FILES"
          echo "════════════════════════════════════════════════════════"
          if [ -f "/tmp/person_info.json" ]; then
            echo "📄 Person info:"
            cat /tmp/person_info.json | jq '.'
          else
            echo "❌ /tmp/person_info.json not found"
          fi
          echo ""
          echo "📊 Family tree changes:"
          git diff family_tree.json | head -50
          echo "════════════════════════════════════════════════════════"

      - name: Run calculation scripts
        if: steps.find_issue.outputs.issue_number != ''
        run: |
          echo "════════════════════════════════════════════════════════"
          echo "🧮 RUNNING CALCULATION SCRIPTS"
          echo "════════════════════════════════════════════════════════"
          for script in add_generations.py add_ethnicity.py calculate_completion.py; do
            if [ -f "$script" ]; then
              echo "▶️  Running $script..."
              python3 "$script"
              echo "✅ Completed"
            else
              echo "⚠️  $script not found"
            fi
            echo ""
          done
          echo "════════════════════════════════════════════════════════"

      - name: Update README
        if: steps.find_issue.outputs.issue_number != ''
        run: |
          python3 .github/scripts/update_readme.py
          echo ""
          echo "📊 README changes:"
          git diff README.md | head -30

      - name: Close issue
        if: steps.find_issue.outputs.issue_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/close_issue.py

      - name: Commit and push
        if: steps.find_issue.outputs.issue_number != ''
        run: |
          echo "════════════════════════════════════════════════════════"
          echo "💾 COMMITTING CHANGES"
          echo "════════════════════════════════════════════════════════"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          echo "📊 Files changed:"
          git status --short
          git add family_tree.json README.md
          if git diff --staged --quiet; then
            echo "ℹ️  No changes to commit"
          else
            PERSON_NAME=$(cat /tmp/person_info.json | jq -r '.name')
            git commit -m "Add $PERSON_NAME to family tree (test workflow)"
            git push
            echo "✅ Changes committed and pushed!"
          fi
          echo "════════════════════════════════════════════════════════"

      - name: Final summary
        if: always()
        run: |
          echo "════════════════════════════════════════════════════════"
          echo "📊 FINAL SUMMARY"
          echo "════════════════════════════════════════════════════════"
          if [ -f "/tmp/person_info.json" ]; then
            echo "✅ Person processed:"
            cat /tmp/person_info.json | jq '.'
          else
            echo "❌ No person was processed"
          fi
          echo ""
          echo "🏁 Workflow complete!"
          echo "════════════════════════════════════════════════════════"
