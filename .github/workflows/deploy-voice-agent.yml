name: Deploy Voice Agent to Fly.io

on:
  push:
    branches: [main]
    paths:
      - 'voice_server.py'
      - 'voice_query.html'
      - 'queries.html'
      - 'requirements.txt'
      - 'Dockerfile'
      - 'fly.toml'
      - '.github/workflows/deploy-voice-agent.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Set secrets on Fly.io (if not already set)
        run: |
          echo "🔐 Setting secrets on Fly.io..."
          echo ""
          echo "Checking GitHub secrets availability:"
          echo "  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN != '' && '✅ Set' || '❌ NOT SET' }}"
          echo "  XAI_API_KEY: ${{ secrets.XAI_API_KEY != '' && '✅ Set' || '❌ NOT SET' }}"
          echo "  GOOGLE_GENAI_API_KEY: ${{ secrets.GOOGLE_GENAI_API_KEY != '' && '✅ Set' || '❌ NOT SET' }}"
          echo "  RUFFTREE_STORE_NAME: ${{ secrets.RUFFTREE_STORE_NAME != '' && '✅ Set' || '❌ NOT SET' }}"
          echo ""

          # Check if XAI_API_KEY is actually available
          if [ -z "${{ secrets.XAI_API_KEY }}" ]; then
            echo "❌ ERROR: XAI_API_KEY secret is empty or not set in GitHub!"
            echo "   Go to: https://github.com/patruff/rufftree/settings/secrets/actions"
            echo "   Make sure XAI_API_KEY exists and has a value"
            exit 1
          fi

          echo "Setting secrets with flyctl..."
          echo ""

          # Set each secret individually to see which ones fail
          echo "Setting XAI_API_KEY..."
          if flyctl secrets set "XAI_API_KEY=${{ secrets.XAI_API_KEY }}"; then
            echo "  ✅ XAI_API_KEY set successfully"
          else
            echo "  ❌ Failed to set XAI_API_KEY"
          fi

          echo ""
          echo "Setting GOOGLE_GENAI_API_KEY..."
          if flyctl secrets set "GOOGLE_GENAI_API_KEY=${{ secrets.GOOGLE_GENAI_API_KEY }}"; then
            echo "  ✅ GOOGLE_GENAI_API_KEY set successfully"
          else
            echo "  ❌ Failed to set GOOGLE_GENAI_API_KEY"
          fi

          echo ""
          echo "Setting RUFFTREE_STORE_NAME..."
          if flyctl secrets set "RUFFTREE_STORE_NAME=${{ secrets.RUFFTREE_STORE_NAME }}"; then
            echo "  ✅ RUFFTREE_STORE_NAME set successfully"
          else
            echo "  ❌ Failed to set RUFFTREE_STORE_NAME"
          fi

          echo ""
          echo "Verifying secrets are set on Fly.io..."
          flyctl secrets list
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify deployment
        run: |
          echo "✅ Deployment complete!"
          echo "🌐 App URL: https://rufftree-voice.fly.dev"
          echo "❤️  Health check: https://rufftree-voice.fly.dev/health"
          echo ""
          echo "Testing health endpoint..."
          sleep 10
          curl -f https://rufftree-voice.fly.dev/health || echo "⚠️  Health check failed - check logs with: fly logs"
