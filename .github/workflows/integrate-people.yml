name: Integrate Generated People

on:
  # Allow manual trigger
  workflow_dispatch:

  # Run when files are added to generated_people/
  push:
    paths:
      - 'generated_people/*.json'

jobs:
  integrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Integrate generated people into family tree
        run: |
          python - <<'EOF'
          import json
          import os
          from pathlib import Path
          import shutil

          # Load existing family tree
          with open('family_tree.json', 'r') as f:
              family_data = json.load(f)

          people = family_data['family']['people']
          generated_folder = Path('generated_people')
          processed_folder = generated_folder / 'processed'
          processed_folder.mkdir(exist_ok=True)

          # Find all JSON files in generated_people/
          json_files = list(generated_folder.glob('*.json'))

          if not json_files:
              print("No generated people to integrate")
              exit(0)

          print(f"Found {len(json_files)} person/people to integrate")

          integrated_count = 0
          for json_file in json_files:
              try:
                  with open(json_file, 'r') as f:
                      person = json.load(f)

                  person_id = person['id']

                  # Check if person already exists
                  if person_id in people:
                      print(f"⚠️  Person {person_id} already exists, skipping")
                      continue

                  # Add person to family tree
                  people[person_id] = person
                  integrated_count += 1
                  print(f"✅ Integrated: {person['name']} (ID: {person_id})")

                  # Move to processed folder
                  shutil.move(str(json_file), str(processed_folder / json_file.name))

              except Exception as e:
                  print(f"❌ Error processing {json_file.name}: {e}")
                  continue

          if integrated_count > 0:
              # Save updated family tree
              with open('family_tree.json', 'w') as f:
                  json.dump(family_data, f, indent=2)

              print(f"\n✅ Successfully integrated {integrated_count} person/people")
          else:
              print("\nNo new people to integrate")
              exit(0)
          EOF

      - name: Commit updated family tree
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add family_tree.json generated_people/
          git diff --staged --quiet || git commit -m "Integrate generated family members into family tree"
          git push
