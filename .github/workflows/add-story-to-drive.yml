name: Add Story to RAG

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Story title'
        required: true
        type: string
      about:
        description: 'Who is this story about? (comma-separated names)'
        required: true
        type: string
      story:
        description: 'The story content (use \n for line breaks)'
        required: true
        type: string
      author:
        description: 'Author name'
        required: false
        default: 'Patrick Ruff'
        type: string

jobs:
  add-story:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Add story to RAG system
        id: add_story
        env:
          GOOGLE_GENAI_API_KEY: ${{ secrets.GOOGLE_GENAI_API_KEY }}
          GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
          STORY_TITLE: ${{ github.event.inputs.title }}
          STORY_ABOUT: ${{ github.event.inputs.about }}
          STORY_AUTHOR: ${{ github.event.inputs.author }}
          STORY_INPUT: ${{ github.event.inputs.story }}
        run: |
          # Convert \n to actual newlines in story content
          STORY_CONTENT=$(echo "$STORY_INPUT" | sed 's/\\n/\n/g')

          python add_story_to_drive.py \
            --title "$STORY_TITLE" \
            --about "$STORY_ABOUT" \
            --author "$STORY_AUTHOR" \
            --story "$STORY_CONTENT"

      - name: Validate story was indexed
        id: validate
        env:
          GOOGLE_GENAI_API_KEY: ${{ secrets.GOOGLE_GENAI_API_KEY }}
          STORY_TITLE: ${{ github.event.inputs.title }}
          STORY_ABOUT: ${{ github.event.inputs.about }}
        run: |
          echo "⏳ Waiting 10 seconds for indexing to complete..."
          sleep 10

          python -c "
          import os
          import sys
          from datetime import datetime
          from test_file_search import get_client, get_or_create_store, query_documents

          title = os.getenv('STORY_TITLE', '')
          about = os.getenv('STORY_ABOUT', '')

          print('\n🔍 VALIDATING STORY WAS INDEXED')
          print('=' * 60)

          client = get_client()
          store_name = get_or_create_store(client)

          # Generate expected filename pattern
          date_str = datetime.now().strftime('%Y%m%d')
          safe_title = ''.join(c if c.isalnum() or c in ' -_' else '' for c in title)
          safe_title = safe_title.strip().replace(' ', '_').lower()[:50]
          expected_pattern = f'{date_str}_patstory_{safe_title}'

          print(f'Looking for document matching: {expected_pattern}*')
          print()

          # Check 1: Verify document appears in store listing
          print('📋 CHECK 1: Document exists in store')
          docs = list(client.file_search_stores.documents.list(parent=store_name))

          found_doc = None
          for doc in docs:
              display_name = getattr(doc, 'display_name', '') or ''
              if expected_pattern in display_name.lower():
                  found_doc = doc
                  break

          if found_doc:
              print(f'   ✅ Found: {getattr(found_doc, \"display_name\", \"Unknown\")}')
              state = getattr(found_doc, 'state', 'unknown')
              print(f'   State: {state}')
          else:
              print(f'   ⚠️  Document not found yet (may still be indexing)')
              # List recent documents
              print('   Recent documents:')
              for doc in docs[:5]:
                  print(f'      - {getattr(doc, \"display_name\", \"Unknown\")}')

          # Check 2: Run a test query to verify content is searchable
          print()
          print('📋 CHECK 2: Content is searchable')
          test_query = f'What do you know about a story titled \"{title}\" that mentions {about}?'
          print(f'   Query: {test_query[:60]}...')

          try:
              answer, citations = query_documents(client, store_name, test_query, 'gemini-2.5-flash')

              # Check if the story was cited
              story_cited = False
              for citation in citations:
                  cite_title = citation.get('title', '')
                  if expected_pattern in cite_title.lower() or title.lower() in cite_title.lower():
                      story_cited = True
                      break

              if story_cited:
                  print('   ✅ Story was cited in response!')
              elif citations:
                  print(f'   ⚠️  Got citations but story not specifically cited')
                  print(f'   Citations: {[c.get(\"title\", \"\") for c in citations]}')
              else:
                  print('   ⚠️  No citations in response (content may still be indexing)')
          except Exception as e:
              print(f'   ⚠️  Query check failed: {e}')

          print()
          print('=' * 60)
          if found_doc:
              print('✅ VALIDATION PASSED: Story is in the RAG system')
              # Write to GitHub output
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('validated=true\n')
                  f.write(f'doc_name={getattr(found_doc, \"display_name\", \"\")}\n')
          else:
              print('⚠️  VALIDATION WARNING: Story not found yet (may need more indexing time)')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('validated=false\n')
          print('=' * 60)
          "

      - name: Summary
        env:
          VALIDATED: ${{ steps.validate.outputs.validated }}
          DOC_NAME: ${{ steps.validate.outputs.doc_name }}
        run: |
          echo "## Story Added Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Title** | ${{ github.event.inputs.title }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **About** | ${{ github.event.inputs.about }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Author** | ${{ github.event.inputs.author }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Where it was saved" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. **Google Drive** - Appended to the shared \`stories\` document" >> $GITHUB_STEP_SUMMARY
          echo "2. **RAG File Search** - Indexed and immediately searchable" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$VALIDATED" = "true" ]; then
            echo "✅ **Validated**: Story successfully indexed as \`$DOC_NAME\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Pending**: Story uploaded but validation check didn't find it yet (may need more indexing time)" >> $GITHUB_STEP_SUMMARY
          fi
