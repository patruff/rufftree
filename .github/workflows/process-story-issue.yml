name: Process Family Story Issue

on:
  # Allow manual triggering for reprocessing
  workflow_dispatch:
  # Trigger when issue is opened or labeled
  issues:
    types: [labeled, opened]

jobs:
  process-story:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Check if this is a story issue
        id: check
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          # Check if this looks like a story issue
          if [[ "$ISSUE_TITLE" == *"[Story]"* ]] || [[ "$ISSUE_BODY" == *"### Your Story"* ]]; then
            echo "is_story=true" >> $GITHUB_OUTPUT
            echo "✅ This is a story issue, will process"
          else
            echo "is_story=false" >> $GITHUB_OUTPUT
            echo "⏭️  Not a story issue, skipping"
          fi

      - name: Checkout repository
        if: steps.check.outputs.is_story == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.check.outputs.is_story == 'true'
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.check.outputs.is_story == 'true'
        run: pip install -r requirements.txt

      - name: Extract story from issue
        if: steps.check.outputs.is_story == 'true'
        id: extract
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python - <<'EOF'
          import os
          import re

          issue_body = os.environ.get('ISSUE_BODY', '')
          issue_number = os.environ.get('ISSUE_NUMBER', '')

          print(f"Processing story issue #{issue_number}")

          # Extract fields from issue body (form-style format)
          def extract_field(pattern, body, default=''):
              match = re.search(pattern, body, re.DOTALL)
              if match:
                  value = match.group(1).strip()
                  if value and value.lower() != '_no response_':
                      return value
              return default

          title = extract_field(r'### Story Title\s*\n\n(.+?)(?:\n\n###|\Z)', issue_body, 'Untitled Story')
          author = extract_field(r'### Your Name \(Author\)\s*\n\n(.+?)(?:\n\n###|\Z)', issue_body, '')
          # Fallback to old field name for backwards compatibility
          if not author:
              author = extract_field(r'### Your Name\s*\n\n(.+?)(?:\n\n###|\Z)', issue_body, 'Anonymous')
          story = extract_field(r'### Your Story\s*\n\n([\s\S]*?)(?:\n\n###|\n\n---|\Z)', issue_body, '')

          # Extract decade from dropdown
          decade = extract_field(r'### When Did This Story Take Place\?\s*\n\n(.+?)(?:\n\n###|\Z)', issue_body, '')
          # Also check for specific date
          specific_date = extract_field(r'### Specific Date or Year \(Optional\)\s*\n\n(.+?)(?:\n\n###|\Z)', issue_body, '')

          # Extract mentioned people from checkboxes
          mentions_section = re.search(r'### Who Is This Story About\?\s*\n\n([\s\S]*?)(?:\n\n###|\Z)', issue_body)
          # Fallback to old field name
          if not mentions_section:
              mentions_section = re.search(r'### Family Members in This Story\s*\n\n([\s\S]*?)(?:\n\n###|\Z)', issue_body)
          mentioned = []
          if mentions_section:
              for line in mentions_section.group(1).split('\n'):
                  if '[X]' in line or '[x]' in line:
                      name_match = re.search(r'\[x\]\s*(.+)', line, re.IGNORECASE)
                      if name_match:
                          name = name_match.group(1).strip()
                          if name.lower() not in ['other (specify in story)', 'other (specify below)']:
                              mentioned.append(name)

          # Also get "Other People" field
          other = extract_field(r'### Other People This Story Is About\s*\n\n(.+?)(?:\n\n###|\Z)', issue_body, '')
          if not other:
              other = extract_field(r'### Other People Mentioned\s*\n\n(.+?)(?:\n\n###|\Z)', issue_body, '')
          if other:
              mentioned.extend([p.strip() for p in other.split(',') if p.strip()])

          about = ', '.join(mentioned) if mentioned else 'Family'

          print(f"Title: {title}")
          print(f"Author: {author}")
          print(f"About: {about}")
          print(f"Decade: {decade}")
          print(f"Specific date: {specific_date}")
          print(f"Story length: {len(story)} chars")

          # Write outputs
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"title={title}\n")
              f.write(f"author={author}\n")
              f.write(f"about={about}\n")
              f.write(f"decade={decade}\n")
              f.write(f"specific_date={specific_date}\n")

          # Write story to temp file (to handle special chars)
          with open('/tmp/story_content.txt', 'w') as f:
              f.write(story)

          print("✅ Story extracted successfully")
          EOF

      - name: Add story to RAG system
        if: steps.check.outputs.is_story == 'true'
        id: add_story
        env:
          GOOGLE_GENAI_API_KEY: ${{ secrets.GOOGLE_GENAI_API_KEY }}
          GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
          STORY_TITLE: ${{ steps.extract.outputs.title }}
          STORY_ABOUT: ${{ steps.extract.outputs.about }}
          STORY_AUTHOR: ${{ steps.extract.outputs.author }}
          STORY_DECADE: ${{ steps.extract.outputs.decade }}
          STORY_SPECIFIC_DATE: ${{ steps.extract.outputs.specific_date }}
        run: |
          # Use Python to safely handle story content with special characters
          python - <<'EOF'
          import subprocess
          import os

          # Read story from temp file
          with open('/tmp/story_content.txt', 'r') as f:
              story_content = f.read()

          # Build command arguments safely
          cmd = [
              'python', 'add_story_to_drive.py',
              '--title', os.environ['STORY_TITLE'],
              '--about', os.environ['STORY_ABOUT'],
              '--author', os.environ['STORY_AUTHOR']
          ]

          # Add optional arguments
          if os.environ.get('STORY_DECADE'):
              cmd.extend(['--decade', os.environ['STORY_DECADE']])

          if os.environ.get('STORY_SPECIFIC_DATE'):
              cmd.extend(['--specific-date', os.environ['STORY_SPECIFIC_DATE']])

          # Add story content
          cmd.extend(['--story', story_content])

          # Execute command
          subprocess.run(cmd, check=True)
          EOF

      - name: Track contributor
        if: steps.check.outputs.is_story == 'true'
        env:
          STORY_AUTHOR: ${{ steps.extract.outputs.author }}
          STORY_TITLE: ${{ steps.extract.outputs.title }}
          STORY_ABOUT: ${{ steps.extract.outputs.about }}
        run: |
          # Track the story contribution
          AUTHOR="${STORY_AUTHOR:-Anonymous}"
          python track_contributors.py add-story \
            --author "$AUTHOR" \
            --title "$STORY_TITLE" \
            --about "$STORY_ABOUT"

          # Update the README leaderboard
          python track_contributors.py update-leaderboard

      - name: Update README with latest story
        if: steps.check.outputs.is_story == 'true'
        env:
          GOOGLE_GENAI_API_KEY: ${{ secrets.GOOGLE_GENAI_API_KEY }}
          STORY_TITLE: ${{ steps.extract.outputs.title }}
          STORY_ABOUT: ${{ steps.extract.outputs.about }}
          STORY_SPECIFIC_DATE: ${{ steps.extract.outputs.specific_date }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python - <<'EOF'
          import json
          import os
          import re
          from datetime import datetime

          story_title = os.environ.get('STORY_TITLE', '')
          story_about = os.environ.get('STORY_ABOUT', '')
          story_date = os.environ.get('STORY_SPECIFIC_DATE', '')
          issue_number = os.environ.get('ISSUE_NUMBER', '')

          # Count stories in RAG by querying the File Search store
          try:
              from test_file_search import get_client, get_or_create_store

              client = get_client()
              store_name = get_or_create_store(client)

              # List all documents and count stories (patstory_ files)
              docs = list(client.file_search_stores.documents.list(parent=store_name))
              story_count = sum(1 for doc in docs if 'patstory_' in getattr(doc, 'display_name', '').lower())

              print(f"Found {story_count} stories in RAG system")
          except Exception as e:
              print(f"Warning: Could not count stories in RAG: {e}")
              story_count = "Unknown"

          # Format the date nicely
          date_str = story_date if story_date else datetime.now().strftime("%B %d, %Y")

          # Read current README
          with open('README.md', 'r') as f:
              readme = f.read()

          # Find the Recent Additions section and update it
          pattern = r'(### Recent Family Stories\s+)(.*?)(\n\n> )'

          def update_stories_section(match):
              header = match.group(1)
              old_content = match.group(2)
              note_marker = match.group(3)

              # Extract existing stories (to keep the second one)
              story_lines = [line for line in old_content.strip().split('\n') if line.strip() and not line.startswith('> ')]

              # Create new entry with truncated title if too long
              display_title = story_title[:50] + "..." if len(story_title) > 50 else story_title
              new_entry = f"- **{display_title}** - {story_about}. {date_str}. _(Issue #{issue_number})_"

              # Keep only the most recent previous story (if exists and isn't a placeholder)
              second_story = ""
              if story_lines and not story_lines[0].startswith('- _(Add the next'):
                  if len(story_lines) > 0 and '(' in story_lines[0]:
                      second_story = "\n" + story_lines[0]

              new_section = f"{header}{new_entry}{second_story}\n\n> **Total Stories in RAG:** {story_count}\n> "
              return new_section

          readme = re.sub(pattern, update_stories_section, readme, flags=re.DOTALL)

          # Write updated README
          with open('README.md', 'w') as f:
              f.write(readme)

          print(f"✅ Updated README: Added '{story_title}' (Total: {story_count} stories)")
          EOF

      - name: Commit README and contributor updates
        if: steps.check.outputs.is_story == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md contributors.json
          git diff --staged --quiet || git commit -m "Update README and contributors for story '${{ steps.extract.outputs.title }}' by ${{ steps.extract.outputs.author }}"
          git push

      - name: Update labels and close issue
        if: steps.check.outputs.is_story == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `${{ steps.extract.outputs.title }}`;
            const author = `${{ steps.extract.outputs.author }}`;
            const about = `${{ steps.extract.outputs.about }}`;
            const decade = `${{ steps.extract.outputs.decade }}`;
            const specificDate = `${{ steps.extract.outputs.specific_date }}`;

            // Remove pending label
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'story:pending'
              });
            } catch (e) {
              console.log('story:pending label not present');
            }

            // Add processed label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['story:processed']
            });

            // Build time period display
            let timePeriod = decade || 'Not specified';
            if (specificDate) {
              timePeriod = specificDate + (decade ? ` (${decade})` : '');
            }

            // Post success comment and close
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## ✅ Story Added Successfully!

            | Field | Value |
            |-------|-------|
            | **Title** | ${title} |
            | **Author** | ${author} |
            | **About** | ${about} |
            | **Time Period** | ${timePeriod} |

            ### Metadata Applied:
            - \`author\`: ${author}
            - \`subject_of_story\`: ${about}
            - \`content_type\`: story
            ${decade ? `- \`decade\`: ${decade}` : ''}

            ### Where your story was saved:

            1. **Google Docs** - Added to the shared family stories document
            2. **RAG Search** - Now searchable via AI queries with metadata filtering

            Thank you for sharing this family memory! 🙏

            ---
            *This story was automatically processed and is now part of the family archive.*`
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
