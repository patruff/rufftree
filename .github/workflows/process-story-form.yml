name: Process Story Form Submissions

on:
  # Run every hour to check for new submissions
  schedule:
    - cron: '0 * * * *'  # Every hour

  # Allow manual trigger
  workflow_dispatch:

jobs:
  process-stories:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Process new story submissions
        id: process
        env:
          GOOGLE_GENAI_API_KEY: ${{ secrets.GOOGLE_GENAI_API_KEY }}
          GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
          STORY_SUBMISSIONS_SHEET_ID: ${{ secrets.STORY_SUBMISSIONS_SHEET_ID }}
        run: |
          python process_story_submissions.py

      - name: Summary
        run: |
          echo "## Story Form Submissions Processed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the workflow logs for details on processed stories." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Form Link**: Share this with family members to submit stories!" >> $GITHUB_STEP_SUMMARY
