name: Process Add Person Issue

on:
  workflow_dispatch:
  issues:
    types: [labeled, opened]

jobs:
  process-person:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install GitHub CLI
        run: |
          sudo apt update
          sudo apt install gh -y

      - name: Get triggered issue or find open issues
        id: find_issues
        uses: actions/github-script@v7
        with:
          script: |
            let issues = [];

            // If triggered by an issue event, process that specific issue
            if (context.eventName === 'issues' && context.payload.issue) {
              const issue = context.payload.issue;
              console.log(`🎯 Processing triggered issue #${issue.number}: ${issue.title}`);

              // Check if it's an add-person issue
              if (issue.title.startsWith('Add Person:')) {
                issues = [issue];
                console.log('✅ Issue is an add-person issue');
              } else {
                console.log('⚠️ Issue is not an add-person issue, skipping');
              }
            } else {
              // If triggered by schedule or manual dispatch, find all open issues
              console.log('🔍 Searching for open issues with "add-person" label...');
              const result = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: 'add-person',
                state: 'open',
                per_page: 100
              });
              issues = result.data;
              console.log(`📝 Found ${issues.length} issues to process`);
            }

            // Save issues to file
            const fs = require('fs');
            fs.writeFileSync('/tmp/issues.json', JSON.stringify(issues, null, 2));

            // Set output
            const hasIssues = issues.length > 0;
            core.setOutput('has_issues', hasIssues.toString());

            if (hasIssues) {
              console.log('📊 Issues to process:');
              issues.forEach(issue => console.log(`  #${issue.number}: ${issue.title}`));
            } else {
              console.log('✅ No add-person issues to process');
            }

      - name: Process each issue
        if: steps.find_issues.outputs.has_issues == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "🚀 Processing issues..."

          # Process each issue (use while read to properly handle JSON with spaces)
          cat /tmp/issues.json | jq -c '.[]' | while IFS= read -r issue_json; do
            echo "$issue_json" > /tmp/issue.json

            # Run the processing script
            python3 .github/scripts/process_person.py || echo "⚠️  Failed to process issue"

            # If processing succeeded, run other steps
            if [ -f "/tmp/person_info.json" ]; then
              # Run calculation scripts
              for script in add_generations.py add_ethnicity.py calculate_completion.py; do
                [ -f "$script" ] && python3 "$script"
              done

              # Update README
              python3 .github/scripts/update_readme.py

              # Close issue
              python3 .github/scripts/close_issue.py

              # Clean up for next iteration
              rm -f /tmp/person_info.json
            fi
          done

      - name: Commit and push changes
        if: steps.find_issues.outputs.has_issues == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add family_tree.json README.md

          if git diff --staged --quiet; then
            echo "ℹ️  No changes to commit"
          else
            git commit -m "Process add-person issues (automated)"
            git push
            echo "✅ Changes committed and pushed"
          fi
