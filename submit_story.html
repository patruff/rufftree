<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share Your Story - Ruff Family Archive</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
            text-align: center;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 1.1em;
        }

        select, textarea, input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        select:focus, textarea:focus, input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            min-height: 300px;
            resize: vertical;
            line-height: 1.6;
        }

        .extra-options {
            display: none;
            border-top: 2px solid #e0e0e0;
            margin-top: 20px;
            padding-top: 20px;
        }

        .extra-options.show {
            display: block;
        }

        .toggle-options {
            background: #f5f5f5;
            border: 2px solid #e0e0e0;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            color: #667eea;
            font-weight: 600;
            width: 100%;
            margin-bottom: 20px;
            transition: all 0.3s;
        }

        .toggle-options:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .submit-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 16px 48px;
            font-size: 1.2em;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .checkboxes {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
        }

        .checkbox-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin-right: 8px;
            cursor: pointer;
        }

        .checkbox-item label {
            margin: 0;
            font-weight: normal;
            cursor: pointer;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #fee;
            border: 2px solid #fcc;
            color: #c00;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        .error.show {
            display: block;
        }

        .nav-links {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
        }

        .nav-links a {
            color: #667eea;
            text-decoration: none;
            margin: 0 15px;
            font-weight: 600;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }

        .help-text {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📖 Share Your Story</h1>
        <p class="subtitle">Help preserve our family history by sharing your memories</p>

        <form id="storyForm">
            <!-- Author Selection -->
            <div class="form-group">
                <label for="author">Who is sharing this story? *</label>
                <select id="author" name="author" required>
                    <option value="">-- Select your name --</option>
                    <option value="Anonymous">Anonymous</option>
                </select>
                <p class="help-text">Select your name or choose "Anonymous"</p>
            </div>

            <!-- Story Content -->
            <div class="form-group">
                <label for="story">Your Story *</label>
                <textarea id="story" name="story" required placeholder="Share your family memory here...

What happened? Who was there? Where did it take place? What makes this memory special?

Be as detailed as you can - these stories preserve our family history for future generations."></textarea>
            </div>

            <!-- Toggle Extra Options -->
            <button type="button" class="toggle-options" onclick="toggleExtraOptions()">
                ➕ Extra Options (Title, Date, People Mentioned)
            </button>

            <!-- Extra Options Section (Hidden by Default) -->
            <div class="extra-options" id="extraOptions">
                <div class="form-group">
                    <label for="title">Story Title (Optional)</label>
                    <input type="text" id="title" name="title" placeholder="e.g., The Time Grandpa Built the Treehouse">
                    <p class="help-text">Give your story a title, or we'll generate one</p>
                </div>

                <div class="form-group">
                    <label>Who is this story about? (Optional)</label>
                    <div class="checkboxes" id="peopleCheckboxes">
                        <!-- Populated from family_tree.json -->
                    </div>
                </div>

                <div class="form-group">
                    <label for="otherPeople">Other People Mentioned (Optional)</label>
                    <input type="text" id="otherPeople" name="otherPeople" placeholder="Uncle Bob, Cousin Lisa">
                    <p class="help-text">Comma-separated names not in the list above</p>
                </div>

                <div class="form-group">
                    <label for="decade">When did this happen? (Optional)</label>
                    <select id="decade" name="decade">
                        <option value="">-- Select decade --</option>
                        <option value="2020s (2020-present)">2020s (2020-present)</option>
                        <option value="2010s (2010-2019)">2010s (2010-2019)</option>
                        <option value="2000s (2000-2009)">2000s (2000-2009)</option>
                        <option value="1990s (1990-1999)">1990s (1990-1999)</option>
                        <option value="1980s (1980-1989)">1980s (1980-1989)</option>
                        <option value="1970s (1970-1979)">1970s (1970-1979)</option>
                        <option value="1960s (1960-1969)">1960s (1960-1969)</option>
                        <option value="1950s (1950-1959)">1950s (1950-1959)</option>
                        <option value="1940s (1940-1949)">1940s (1940-1949)</option>
                        <option value="1930s or earlier">1930s or earlier</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="specificDate">Specific Date or Year (Optional)</label>
                    <input type="text" id="specificDate" name="specificDate" placeholder="e.g., Summer 1985">
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="submit-btn" id="submitBtn">
                🚀 Share Your Story
            </button>

            <!-- Loading -->
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p style="margin-top: 15px; color: #667eea; font-weight: 600;">Saving your story...</p>
            </div>

            <!-- Error -->
            <div class="error" id="error">
                <strong>Error:</strong> <span id="errorMessage"></span>
            </div>
        </form>

        <!-- Navigation -->
        <div class="nav-links">
            <a href="index.html">🌳 View Family Tree</a>
            <a href="queries.html">💬 Ask Questions</a>
        </div>
    </div>

    <script src="submit_story.js"></script>
</body>
</html>
