<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Member Generator - Rufftree</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
        }

        input[type="text"],
        input[type="number"],
        select,
        textarea {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
            font-family: inherit;
        }

        .required {
            color: #e74c3c;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 20px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .preview {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            display: none;
        }

        .preview h3 {
            color: #333;
            margin-bottom: 10px;
        }

        .preview pre {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 12px;
            border: 1px solid #e0e0e0;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-secondary {
            background: #6c757d;
        }

        .btn-secondary:hover {
            box-shadow: 0 10px 20px rgba(108, 117, 125, 0.3);
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌳 Family Member Generator</h1>
        <p class="subtitle">Generate family member data for the Ruff family tree</p>

        <form id="personForm">
            <div class="form-grid">
                <div class="form-group">
                    <label for="firstName">First Name <span class="required">*</span></label>
                    <input type="text" id="firstName" required>
                </div>

                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" value="Ruff">
                </div>

                <div class="form-group">
                    <label for="hairColor">Hair Color</label>
                    <select id="hairColor">
                        <option value="">Not specified</option>
                        <option value="blonde">Blonde</option>
                        <option value="brunette">Brunette</option>
                        <option value="redhead">Redhead</option>
                        <option value="black">Black</option>
                        <option value="gray">Gray</option>
                        <option value="white">White</option>
                        <option value="bald">Bald</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="height">Height</label>
                    <select id="height">
                        <option value="">Not specified</option>
                        <option value="short">Short</option>
                        <option value="medium">Medium</option>
                        <option value="tall">Tall</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="decadeBorn">Decade Born</label>
                    <select id="decadeBorn">
                        <option value="">Not specified</option>
                        <option value="1900s">1900s</option>
                        <option value="1910s">1910s</option>
                        <option value="1920s">1920s</option>
                        <option value="1930s">1930s</option>
                        <option value="1940s">1940s</option>
                        <option value="1950s">1950s</option>
                        <option value="1960s">1960s</option>
                        <option value="1970s">1970s</option>
                        <option value="1980s">1980s</option>
                        <option value="1990s">1990s</option>
                        <option value="2000s">2000s</option>
                        <option value="2010s">2010s</option>
                        <option value="2020s">2020s</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="yearBorn">Year Born (exact)</label>
                    <input type="number" id="yearBorn" min="1900" max="2030" placeholder="e.g., 1985">
                </div>

                <div class="form-group">
                    <label for="status">Status</label>
                    <select id="status">
                        <option value="alive">Alive</option>
                        <option value="deceased">Deceased</option>
                    </select>
                </div>

                <div class="form-group" id="decadeDeceasedGroup" style="display: none;">
                    <label for="decadeDeceased">Decade Deceased</label>
                    <select id="decadeDeceased">
                        <option value="">Not specified</option>
                        <option value="1900s">1900s</option>
                        <option value="1910s">1910s</option>
                        <option value="1920s">1920s</option>
                        <option value="1930s">1930s</option>
                        <option value="1940s">1940s</option>
                        <option value="1950s">1950s</option>
                        <option value="1960s">1960s</option>
                        <option value="1970s">1970s</option>
                        <option value="1980s">1980s</option>
                        <option value="1990s">1990s</option>
                        <option value="2000s">2000s</option>
                        <option value="2010s">2010s</option>
                        <option value="2020s">2020s</option>
                    </select>
                </div>

                <div class="form-group" id="yearDeceasedGroup" style="display: none;">
                    <label for="yearDeceased">Year Deceased (exact)</label>
                    <input type="number" id="yearDeceased" min="1900" max="2030" placeholder="e.g., 2020">
                </div>

                <div class="form-group">
                    <label for="education">Education Level</label>
                    <select id="education">
                        <option value="">Not specified</option>
                        <option value="elementary">Elementary School</option>
                        <option value="high-school">High School</option>
                        <option value="some-college">Some College</option>
                        <option value="college">College Degree</option>
                        <option value="masters">Master's Degree</option>
                        <option value="phd">PhD/Doctorate</option>
                    </select>
                </div>

                <div class="form-group" id="causeOfDeathGroup" style="display: none;">
                    <label for="causeOfDeath">Cause of Death</label>
                    <select id="causeOfDeath">
                        <option value="">Not specified</option>
                        <option value="cancer">Cancer</option>
                        <option value="heart-disease">Heart Disease</option>
                        <option value="stroke">Stroke</option>
                        <option value="accident">Accident</option>
                        <option value="natural-causes">Natural Causes</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label for="occupation">Occupation</label>
                    <input type="text" id="occupation" placeholder="e.g., Teacher, Engineer, Retired">
                </div>

                <div class="form-group full-width">
                    <label for="notes">Notes</label>
                    <textarea id="notes" placeholder="Any additional information about this person..."></textarea>
                </div>
            </div>

            <button type="submit" class="btn">Generate Person</button>
        </form>

        <div class="preview" id="preview">
            <h3>Generated JSON</h3>
            <pre id="jsonOutput"></pre>
            <div class="actions">
                <button class="btn" onclick="downloadJSON()">Download JSON</button>
                <button class="btn btn-secondary" onclick="copyToClipboard()">Copy to Clipboard</button>
            </div>
        </div>
    </div>

    <script>
        let generatedData = null;

        // Show/hide deceased-related fields
        document.getElementById('status').addEventListener('change', function() {
            const isDeceased = this.value === 'deceased';
            document.getElementById('decadeDeceasedGroup').style.display = isDeceased ? 'block' : 'none';
            document.getElementById('yearDeceasedGroup').style.display = isDeceased ? 'block' : 'none';
            document.getElementById('causeOfDeathGroup').style.display = isDeceased ? 'block' : 'none';
        });

        document.getElementById('personForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim() || 'Ruff';
            const fullName = lastName ? `${firstName} ${lastName}` : firstName;

            // Generate unique ID
            const id = firstName.toLowerCase().replace(/\s+/g, '_') + '_' + Date.now();

            // Build person object
            const person = {
                id: id,
                name: fullName,
                firstName: firstName,
                lastName: lastName
            };

            // Add optional fields
            const yearBorn = document.getElementById('yearBorn').value;
            const decadeBorn = document.getElementById('decadeBorn').value;
            if (yearBorn) {
                person.dob = yearBorn;
            } else if (decadeBorn) {
                person.decadeBorn = decadeBorn;
            }

            const status = document.getElementById('status').value;
            if (status === 'deceased') {
                const yearDeceased = document.getElementById('yearDeceased').value;
                const decadeDeceased = document.getElementById('decadeDeceased').value;
                if (yearDeceased) {
                    person.dod = yearDeceased;
                } else if (decadeDeceased) {
                    person.decadeDeceased = decadeDeceased;
                }

                const causeOfDeath = document.getElementById('causeOfDeath').value;
                if (causeOfDeath) {
                    person.causeOfDeath = causeOfDeath;
                }
            } else {
                person.dod = 'alive';
            }

            const hairColor = document.getElementById('hairColor').value;
            if (hairColor) person.hairColor = hairColor;

            const height = document.getElementById('height').value;
            if (height) person.height = height;

            const education = document.getElementById('education').value;
            if (education) person.education = education;

            const occupation = document.getElementById('occupation').value.trim();
            if (occupation) person.occupation = occupation;

            const notes = document.getElementById('notes').value.trim();
            if (notes) person.notes = notes;

            // Placeholder for relationships
            person.spouseId = null;
            person.parentIds = [];
            person.siblingIds = [];
            person.childrenIds = [];

            generatedData = person;

            // Display preview
            document.getElementById('jsonOutput').textContent = JSON.stringify(person, null, 2);
            document.getElementById('preview').style.display = 'block';
            document.getElementById('preview').scrollIntoView({ behavior: 'smooth' });
        });

        function downloadJSON() {
            if (!generatedData) return;

            const blob = new Blob([JSON.stringify(generatedData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${generatedData.id}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            alert('JSON file downloaded! Add it to the generated_people/ folder in your repository.');
        }

        function copyToClipboard() {
            if (!generatedData) return;

            const text = JSON.stringify(generatedData, null, 2);
            navigator.clipboard.writeText(text).then(() => {
                alert('JSON copied to clipboard!');
            }).catch(err => {
                console.error('Failed to copy:', err);
                alert('Failed to copy to clipboard');
            });
        }
    </script>
</body>
</html>
